<aside class="sidebar">
  <a href="{{ url_for('main.dashboard') }}" class="brand">
    <span class="brand-mark">{{ icon('dumbbell', 18, 2.5) }}</span>
    <span class="brand-name">Gym</span>
  </a>
  <nav class="sidebar-nav">
    {% for item in nav_items %}
      <a href="{{ url_for(item.endpoint) }}"
         class="nav-link{% if request.endpoint == item.endpoint %} active{% endif %}"
         {% if request.endpoint == item.endpoint %}aria-current="page"{% endif %}>
        {{ icon(item.icon) }}
        <span>{{ item.label }}</span>
      </a>
    {% endfor %}
  </nav>
</aside>
